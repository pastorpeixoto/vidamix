<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidamix® - Menu</title>
    <style>
        body {
            background-color: #faf8f5;
            color: #333;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #111;
        }
        .sub {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-whats {
            background-color: #25d366;
        }
        .btn-insta {
            background-color: #e1306c;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vidamix®</h1>
        <div class="sub">Menu Principal</div>
        
        <!-- Botão 1: Cardápio (coloque o link do seu cardápio ou arquivo do cardápio aqui) -->
        <a href="https://pastorpeixoto.github.io/vidamix/" class="btn">Cardápio Digital</a>

        <!-- Botão 2: WhatsApp (ex: https://wa.me/55SEUNUMERO) -->
        <a href="https://wa.me/5544998546285" target="_blank" class="btn btn-whats">WhatsApp</a>

        <!-- Botão 3: Instagram (ex: https://instagram.com/seuusuario) -->
        <a href="https://instagram.com/vidamixbel2" target="_blank" class="btn btn-insta">Instagram</a>
    </div>

</body>
</html>
