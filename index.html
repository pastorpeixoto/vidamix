  // 3. FUNÇÕES DO CARDÁPIO E ENVIO DE PEDIDO
  function montarTela() {
    var container = document.getElementById("produtos");
    if (!container || typeof produtos === "undefined") return;
    
    var html = "";
    produtos.forEach(function(p) {
      html += '<div class="produto-item">';
      html += '  <div><strong>' + p.nome + '</strong></div>';
      html += '  <div>';
      html += '    <button onclick="alterarQtd(' + p.id + ', -1)">-</button>';
      html += '    <span id="qtd-' + p.id + '" style="margin:0 10px; font-weight:bold;">0</span>';
      html += '    <button onclick="alterarQtd(' + p.id + ', 1)">+</button>';
      html += '  </div>';
      html += '</div>';
    });
    
    container.innerHTML = html;
  }

  function alterarQtd(id, delta) {
    var el = document.getElementById("qtd-" + id);
    if (!el) return;
    var qtd = parseInt(el.textContent) + delta;
    if (qtd < 0) qtd = 0;
    el.textContent = qtd;
  }

  function enviarPedido() {
    var texto = "Pedido Vida Mix:\n\n";
    var temItem = false;
    
    produtos.forEach(function(p) {
      var el = document.getElementById("qtd-" + p.id);
      if (el) {
        var qtd = parseInt(el.textContent);
        if (qtd > 0) {
          texto += "• " + p.nome + " - Qtd: " + qtd + "\n";
          temItem = true;
        }
      }
    });

    if (!temItem) {
      alert("Por favor, selecione ao menos um item antes de enviar o pedido.");
      return;
    }

    var url = "https://wa.me/" + numeroWhatsapp + "?text=" + encodeURIComponent(texto);
    window.open(url, "_blank");
  }

  window.onload = function() {
    montarTela();
  };
