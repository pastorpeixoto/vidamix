<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidamix - Pães e Bolos Sem Glúten e Sem Lactose</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f8f9fa; margin: 0; padding: 15px; color: #333; }
    
    .header { text-align: center; padding: 15px; background: #ffffff; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .header h1 { color: #1F5F2B; margin: 0; font-size: 26px; }
    .header p { color: #AEC818; margin: 5px 0 0 0; font-weight: bold; }
    
    .card { background: #ffffff; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #AEC818; }
    .card h3 { margin-top: 0; color: #1F5F2B; }
    .card p { margin: 5px 0; font-size: 14px; color: #666; }
    .price { font-weight: bold; color: #1F5F2B; font-size: 16px; }
    
    .calc-box { margin-top: 15px; background: #f1f8e9; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .controls { display: flex; align-items: center; gap: 6px; }
    
    .btn-qty { background: #1F5F2B; color: white; border: none; width: 36px; height: 36px; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .btn-zero { background: #dc3545; color: white; border: none; padding: 0 10px; height: 36px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .qty-val { font-size: 16px; font-weight: bold; min-width: 60px; text-align: center; }
    
    .btn-wa { background-color: #1F5F2B; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Vidamix</h1>
    <p>Sem Glúten & Sem Lactose</p>
  </div>

  <!-- Produto 1 -->
  <div class="card">
    <h3>Pão Artesanal Multigrãos</h3>
    <p>Sem glúten, sem lactose, com sementes de girassol, linhaça e chia.</p>
    <p class="price">R$ 48,00 / kg</p>
    <div class="calc-box">
      <div class="controls">
        <button class="btn-qty" onclick="alterarQtd('pao', -0.1)">-</button>
        <span class="qty-val"><span id="qtd-pao">0.5</span> kg</span>
        <button class="btn-qty" onclick="alterarQtd('pao', 0.1)">+</button>
        <button class="btn-zero" onclick="zerar('pao')">Zerar</button>
      </div>
      <div>Total: <strong>R$ <span id="total-pao">24,00</span></strong></div>
    </div>
  </div>

  <!-- Produto 2 -->
  <div class="card">
    <h3>Bolo de Cacau 70% com Avelã</h3>
    <p>Feito com cacau puro, sem leite e adoçado com açúcar de coco.</p>
    <p class="price">R$ 65,00 / kg</p>
    <div class="calc-box">
      <div class="controls">
        <button class="btn-qty" onclick="alterarQtd('bolo', -0.1)">-</button>
        <span class="qty-val"><span id="qtd-bolo">0.5</span> kg</span>
        <button class="btn-qty" onclick="alterarQtd('bolo', 0.1)">+</button>
        <button class="btn-zero" onclick="zerar('bolo')">Zerar</button>
      </div>
      <div>Total: <strong>R$ <span id="total-bolo">32,50</span></strong></div>
    </div>
  </div>

  <button class="btn-wa" onclick="enviarWhatsapp()">Finalizar Pedido via WhatsApp</button>

  <script>
    const precos = { pao: 48.00, bolo: 65.00 };
    const qtds = { pao: 0.5, bolo: 0.5 };

    function alterarQtd(produto, valor) {
      qtds[produto] = Math.max(0, Math.round((qtds[produto] + valor) * 10) / 10);
      atualizarTela(produto);
    }

    function zerar(produto) {
      qtds[produto] = 0;
      atualizarTela(produto);
    }

    function atualizarTela(produto) {
      document.getElementById(qtd-${produto}).innerText = qtds[produto].toFixed(1);
      const total = (qtds[produto] * precos[produto]).toFixed(2);
      document.getElementById(total-${produto}).innerText = total.replace('.', ',');
    }

    function enviarWhatsapp() {
      if (qtds.pao === 0 && qtds.bolo === 0) {
        alert("Por favor, selecione a quantidade desejada de pelo menos um produto.");
        return;
      }

      let mensagem = "Olá! Gostaria de fazer o seguinte pedido na Vidamix:\n\n";
      
      if (qtds.pao > 0) {
        const totalPao = (qtds.pao * precos.pao).toFixed(2).replace('.', ',');
        mensagem += - Pão Multigrãos (${qtds.pao.toFixed(1)} kg) - R$ ${totalPao}\n;
      }
      if (qtds.bolo > 0) {
        const totalBolo = (qtds.bolo * precos.bolo).toFixed(2).replace('.', ',');
        mensagem += - Bolo de Cacau (${qtds.bolo.toFixed(1)} kg) - R$ ${totalBolo}\n;
      }

      const url = https://wa.me/5544998646285?text=${encodeURIComponent(mensagem)};
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
