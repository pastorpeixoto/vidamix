  <script>
    var minhaChavePix = "belabelpeixoto@gmail.com";

    var produtos = [

      { id: 24, nome: "Bolo de chocolate", preco: 85.00, unidade: "kg", ingredientes: "Mix de bolo; acucar demerara; cacau em po 100%; oleo de girassol; sal do Himalaia"}, 
      { id: 25, nome: "Empadao de Frango", preco: 110.00, unidade: "kg", ingredientes: "Farinha de arroz; banha ou oleo de girassol"}, 
      { id: 26, nome: "Bolo Tipo Charge", preco: 80.00, unidade: "kg", ingredientes: "Bolo com cobertura de chocolate e amendoim"}, 
      { id: 27, nome: "Bolo de Cenoura", preco: 80.00, unidade: "kg", ingredientes: "Mix de farinhas; acucar demerara; oleo de girassol"},

    ];

    var quantidades = {};

    function formatarQtdTexto(qtd, unidade) {
      if (qtd === 0) return "0";
      if (unidade === "kg") {
        if (qtd < 1) {
          return (qtd * 1000) + "g";
        } else {
          return qtd.toFixed(2).replace('.', ',').replace(',00', '') + "kg";
        }
      }
      return qtd.toString();
    }

    function montarTela() {
      var container = document.getElementById("produtos");
      if (!container) return;
      
      var html = "";
      produtos.forEach(function(p) {
        quantidades[p.id] = 0;
        
        html += '<div class="produto-item">';
        html += '  <div class="produto-topo">';
        html += '    <div class="produto-info">';
        html += '      <span class="produto-nome">' + p.nome + '</span>';
        html += '      <span class="preco">R$ ' + p.preco.toFixed(2).replace('.', ',') + ' / ' + p.unidade + '</span>';
        html += '    </div>';
        html += '  </div>';
        if (p.ingredientes) {
          html += '  <div class="produto-detalhes">Ingredientes: ' + p.ingredientes + '</div>';
        }
        html += '  <div class="produto-controles">';
        html += '    <span style="font-size:12px; font-weight:bold; color:#555;">Qtd:</span>';
        html += '    <div>';
        html += '      <button class="btn-qtd" onclick="alterarQtd(' + p.id + ', -1)">-</button>';
        html += '      <span id="qtd-' + p.id + '" class="qtd-display">0</span>';
        html += '      <button class="btn-qtd" onclick="alterarQtd(' + p.id + ', 1)">+</button>';
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
      });
      
      container.innerHTML = html;
    }

    function alterarQtd(id, direcao) {
      var prod = produtos.find(function(item) { return item.id === id; });
      if (!prod) return;

      var passo = (prod.unidade === "kg") ? 0.25 : 1.0;
      var qtdAtual = quantidades[id] || 0;
      var novaQtd = qtdAtual + (direcao * passo);

      if (novaQtd < 0) novaQtd = 0;
      quantidades[id] = Math.round(novaQtd * 100) / 100;

      var el = document.getElementById("qtd-" + id);
      if (el) {
        el.textContent = formatarQtdTexto(quantidades[id], prod.unidade);
      }
      
      atualizarTotal();
    }

    function apagarTaxa() {
      document.getElementById("taxa-entrega").value = "0.00";
      atualizarTotal();
    }

    function atualizarTotal() {
      var totalProdutos = 0;
      produtos.forEach(function(p) {
        var qtd = quantidades[p.id] || 0;
        totalProdutos += qtd * p.preco;
      });

      var campoTaxa = parseFloat(document.getElementById("taxa-entrega").value);
      var taxa = isNaN(campoTaxa) || campoTaxa < 0 ? 0 : campoTaxa;

      var totalGeral = totalProdutos > 0 ? (totalProdutos + taxa) : 0;
      document.getElementById("valor-total").textContent = "R$ " + totalGeral.toFixed(2).replace('.', ',');
    }

    function zerarQuantidades() {
      produtos.forEach(function(p) {
        quantidades[p.id] = 0;
        var el = document.getElementById("qtd-" + p.id);
        if (el) el.textContent = "0";
      });
      document.getElementById("taxa-entrega").value = "12.00";
      atualizarTotal();
    }

    function copiarPixManual() {
      var chave = minhaChavePix;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(chave).then(function() {
          alert("Chave Pix (" + chave + ") copiada com sucesso!\n\nEste pedido será enviado após a confirmação do pagamento.\n\nAgora clique em 'Enviar WhatsApp'.");
        }).catch(function() {
          copiarComInputTemporario(chave);
        });
      } else {
        copiarComInputTemporario(chave);
      }
    }

    function copiarComInputTemporario(texto) {
      var input = document.createElement("input");
      input.setAttribute("value", texto);
      document.body.appendChild(input);
      input.select();
      input.setSelectionRange(0, 99999);
      
      try {
        document.execCommand("copy");
        alert("Chave Pix copiada com sucesso!\n\nEste pedido será enviado após a confirmação do pagamento.\n\nAgora clique em Enviar WhatsApp.");
      } catch (err) {
        alert("Não foi possível copiar automaticamente. A chave é: " + texto);
      }
      
      document.body.removeChild(input);
    }

    function enviarPedido() {
      var texto = "Pedido Vidamix®:\n\n";
      var temItem = false;
      var totalProdutos = 0;
      
      produtos.forEach(function(p) {
        var qtd = quantidades[p.id] || 0;
        if (qtd > 0) {
          var subtotal = qtd * p.preco;
          totalProdutos += subtotal;
          var qtdFormatada = formatarQtdTexto(qtd, p.unidade);
          texto += "• " + p.nome + " (" + qtdFormatada + ") - R$ " + subtotal.toFixed(2).replace('.', ',') + "\n";
          temItem = true;
        }
      });

      if (!temItem) {
        alert("Por favor, selecione ao menos um item antes de enviar o pedido.");
        return;
      }

      var campoTaxa = parseFloat(document.getElementById("taxa-entrega").value);
      var taxa = isNaN(campoTaxa) || campoTaxa < 0 ? 0 : campoTaxa;
      var totalGeral = totalProdutos + taxa;

      if (taxa > 0) {
        texto += "• Taxa de entrega: R$ " + taxa.toFixed(2).replace('.', ',') + "\n";
      } else {
        texto += "• Opção: Retirada no local (Sem taxa)\n";
      }

      texto += "\n*Total do Pedido:* R$ " + totalGeral.toFixed(2).replace('.', ',');
      texto += "\n*Forma de Pagamento:* Pix (E-mail)\n\n";
      
      texto += "💡 DICA DE PAGAMENTO:\n";
      texto += "A chave Pix já foi copiada no site! Basta abrir o app do seu banco e colar.\n\n";
      texto += "Este pedido será enviado após a confirmação do pagamento.";

      var url = "https://wa.me/" + numeroWhatsapp + "?text=" + encodeURIComponent(texto);
      window.open(url, "_blank");
    }

    window.onload = function() {
      montarTela();
      atualizarTotal();
    };
  </script>
