<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidamix - Pães e Bolos Sem Glúten e Sem Lactose</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; margin: 0; padding: 15px; color: #333; }
    
    .header { text-align: center; padding: 15px; background: #ffffff; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .header h1 { color: #1F5F2B; margin: 0; font-size: 26px; }
    .header p { color: #AEC818; margin: 5px 0 0 0; font-weight: bold; }
    
    .card { background: #ffffff; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #AEC818; }
    .card h3 { margin-top: 0; color: #1F5F2B; }
    .card p { margin: 5px 0; font-size: 14px; color: #666; }
    .price { font-weight: bold; color: #1F5F2B; font-size: 16px; }
    
    .calc-box { margin-top: 15px; background: #f1f8e9; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .controls { display: flex; align-items: center; gap: 8px; }
    
    .btn-qty { background: #1F5F2B; color: #ffffff; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; }
    .btn-zero { background: #dc3545; color: #ffffff; border: none; padding: 0 12px; height: 40px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .qty-val { font-size: 16px; font-weight: bold; min-width: 60px; text-align: center; }
    
    .btn-wa { background-color: #1F5F2B; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Vidamix</h1>
    <p>Sem Glúten & Sem Lactose</p>
  </div>

  <!-- Produto 1 -->
  <div class="card">
    <h3>Pão Artesanal Multigrãos</h3>
    <p>Sem glúten, sem lactose, com sementes de girassol, linhaça e chia.</p>
    <p class="price">R$ 48,00 / kg</p>
    <div class="calc-box">
      <div class="controls">
        <button type="button" class="btn-qty" onclick="diminuirPao()">-</button>
        <span class="qty-val"><span id="qtd-pao">0.5</span> kg</span>
        <button type="button" class="btn-qty" onclick="aumentarPao()">+</button>
        <button type="button" class="btn-zero" onclick="zerarPao()">Zerar</button>
      </div>
      <div>Total: <strong>R$ <span id="total-pao">24,00</span></strong></div>
    </div>
  </div>

  <!-- Produto 2 -->
  <div class="card">
    <h3>Bolo de Cacau 70% com Avelã</h3>
    <p>Feito com cacau puro, sem leite e adoçado com açúcar de coco.</p>
    <p class="price">R$ 65,00 / kg</p>
    <div class="calc-box">
      <div class="controls">
        <button type="button" class="btn-qty" onclick="diminuirBolo()">-</button>
        <span class="qty-val"><span id="qtd-bolo">0.5</span> kg</span>
        <button type="button" class="btn-qty" onclick="aumentarBolo()">+</button>
        <button type="button" class="btn-zero" onclick="zerarBolo()">Zerar</button>
      </div>
      <div>Total: <strong>R$ <span id="total-bolo">32,50</span></strong></div>
    </div>
  </div>

  <button type="button" class="btn-wa" onclick="enviarWhatsapp()">Finalizar Pedido via WhatsApp</button>

  <script>
    var pesoPao = 0.5;
    var pesoBolo = 0.5;
    var precoPao = 48.00;
    var precoBolo = 65.00;

    function atualizarPao() {
      if (pesoPao < 0) pesoPao = 0;
      pesoPao = Math.round(pesoPao * 10) / 10;
      document.getElementById('qtd-pao').innerText = pesoPao.toFixed(1);
      var total = (pesoPao * precoPao).toFixed(2);
      document.getElementById('total-pao').innerText = total.replace('.', ',');
    }

    function aumentarPao() {
      pesoPao += 0.1;
      atualizarPao();
    }

    function diminuirPao() {
      if (pesoPao > 0) {
        pesoPao -= 0.1;
        atualizarPao();
      }
    }

    function zerarPao() {
      pesoPao = 0;
      atualizarPao();
    }

    function atualizarBolo() {
      if (pesoBolo < 0) pesoBolo = 0;
      pesoBolo = Math.round(pesoBolo * 10) / 10;
      document.getElementById('qtd-bolo').innerText = pesoBolo.toFixed(1);
      var total = (pesoBolo * precoBolo).toFixed(2);
      document.getElementById('total-bolo').innerText = total.replace('.', ',');
    }

    function aumentarBolo() {
      pesoBolo += 0.1;
      atualizarBolo();
    }

    function diminuirBolo() {
      if (pesoBolo > 0) {
        pesoBolo -= 0.1;
        atualizarBolo();
      }
    }

    function zerarBolo() {
      pesoBolo = 0;
      atualizarBolo();
    }

    function enviarWhatsapp() {
      if (pesoPao === 0 && pesoBolo === 0) {
        alert("Por favor, selecione ao menos um produto.");
        return;
      }

      var mensagem = "Olá! Gostaria de fazer o seguinte pedido na Vidamix:\n\n";

      if (pesoPao > 0) {
        var totalPao = (pesoPao * precoPao).toFixed(2).replace('.', ',');
        mensagem += "- Pão Multigrãos (" + pesoPao.toFixed(1) + " kg) - R$ " + totalPao + "\n";
      }

      if (pesoBolo > 0) {
        var totalBolo = (pesoBolo * precoBolo).toFixed(2).replace('.', ',');
        mensagem += "- Bolo de Cacau (" + pesoBolo.toFixed(1) + " kg) - R$ " + totalBolo + "\n";
      }

      var url = "https://wa.me/5544998646285?text=" + encodeURIComponent(mensagem);
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
