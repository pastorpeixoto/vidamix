<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidamix®</title>
    <style>
        body {
            background-color: #faf8f5;
            color: #333;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #111;
        }
        .sub {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vidamix®</h1>
        <div class="sub">Marca Registrada</div>
        
        <p style="margin-bottom: 20px; color: #555; font-size: 16px;">Seja bem-vindo! Clique abaixo para ver o cardápio:</p>

        <!-- Botão principal apontando para o cardápio -->
        <a href="botoes.html" class="btn">Abrir Cardápio</a>
    </div>

</body>
</html>
