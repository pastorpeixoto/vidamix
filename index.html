<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidamix - Pães e Bolos Sem Glúten e Sem Lactose</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; margin: 0; padding: 15px; color: #333; }
    
    .header { text-align: center; padding: 20px 0; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .header h1 { color: #1F5F2B; margin: 0; font-size: 28px; }
    .header p { color: #AEC818; margin: 5px 0 0 0; font-weight: bold; }
    
    .card { background: #ffffff; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #AEC818; }
    .card h3 { margin-top: 0; color: #1F5F2B; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .card p { margin: 5px 0; font-size: 14px; color: #666; }
    .price { font-weight: bold; color: #1F5F2B; font-size: 16px; }
    
    .calc-box { margin-top: 10px; background: #f1f8e9; padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
    .calc-box input { width: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 5px; text-align: center; font-size: 15px; font-weight: bold; }
    
    .btn-wa { background-color: #1F5F2B; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn-wa:hover { background-color: #16441e; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Vidamix</h1>
    <p>Sem Glúten & Sem Lactose</p>
  </div>

  <!-- Produto 1 -->
  <div class="card">
    <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500" alt="Pão Multigrãos">
    <h3>Pão Artesanal Multigrãos</h3>
    <p>Sem glúten, sem lactose, enriquecido com sementes de girassol, linhaça e chia.</p>
    <p class="price">R$ 48,00 / kg</p>
    <div class="calc-box">
      <label for="qtd-pao">Peso (kg):</label>
      <input type="number" id="qtd-pao" value="0.5" step="0.1" min="0" oninput="calcular()" onchange="calcular()">
      <span>Total: <strong>R$ <span id="total-pao">24,00</span></strong></span>
    </div>
  </div>

  <!-- Produto 2 -->
  <div class="card">
    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500" alt="Bolo de Cacau">
    <h3>Bolo de Cacau 70% com Avelã</h3>
    <p>Feito com cacau puro, sem leite e adoçado com açúcar de coco.</p>
    <p class="price">R$ 65,00 / kg</p>
    <div class="calc-box">
      <label for="qtd-bolo">Peso (kg):</label>
      <input type="number" id="qtd-bolo" value="0.5" step="0.1" min="0" oninput="calcular()" onchange="calcular()">
      <span>Total: <strong>R$ <span id="total-bolo">32,50</span></strong></span>
    </div>
  </div>

  <button class="btn-wa" onclick="enviarWhatsapp()">Finalizar Pedido via WhatsApp</button>

  <script>
    const precoPao = 48.00;
    const precoBolo = 65.00;

    function calcular() {
      const qtdPao = parseFloat(document.getElementById('qtd-pao').value) || 0;
      const qtdBolo = parseFloat(document.getElementById('qtd-bolo').value) || 0;

      const totalPao = (qtdPao * precoPao).toFixed(2);
      const totalBolo = (qtdBolo * precoBolo).toFixed(2);

      document.getElementById('total-pao').innerText = totalPao.replace('.', ',');
      document.getElementById('total-bolo').innerText = totalBolo.replace('.', ',');
    }

    function enviarWhatsapp() {
      const qtdPao = parseFloat(document.getElementById('qtd-pao').value) || 0;
      const totalPao = document.getElementById('total-pao').innerText;
      
      const qtdBolo = parseFloat(document.getElementById('qtd-bolo').value) || 0;
      const totalBolo = document.getElementById('total-bolo').innerText;

      if (qtdPao === 0 && qtdBolo === 0) {
        alert("Por favor, selecione ao menos um produto informando o peso.");
        return;
      }

      let mensagem = "Olá! Gostaria de fazer o seguinte pedido na Vidamix:\n\n";
      
      if (qtdPao > 0) {
        mensagem += - Pão Multigrãos (${qtdPao} kg) - R$ ${totalPao}\n;
      }
      if (qtdBolo > 0) {
        mensagem += - Bolo de Cacau (${qtdBolo} kg) - R$ ${totalBolo}\n;
      }

      const url = https://wa.me/5544998646285?text=${encodeURIComponent(mensagem)};
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
