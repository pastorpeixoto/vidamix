<title>Vida Mix - Cardápio e Pedidos</title>

 <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
    h1 { text-align: center; color: #2e7d32; margin-bottom: 20px; }
    .container { max-width: 900px; margin: 0 auto; padding-bottom: 40px; }
    .card-produto { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    .info { max-width: 55%; }
    .info h3 { margin: 0 0 5px 0; color: #1b5e20; }
    .preco { font-weight: bold; color: #388e3c; }
    .ingredientes { font-size: 0.85em; color: #666; margin-top: 5px; }
    .controles { display: flex; align-items: center; gap: 10px; }
    input[type="number"], select { padding: 8px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; }
    input[type="number"] { width: 70px; text-align: center; }
    .subtotal { font-weight: bold; min-width: 80px; text-align: right; color: #2e7d32; }
    
    /* Painel no final da página */
    .painel-finalizacao { background: #2e7d32; color: #fff; padding: 20px; border-radius: 8px; margin-top: 25px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .val-total { font-size: 1.3em; font-weight: bold; }
    .opcoes-pagamento { display: flex; align-items: center; gap: 8px; font-size: 1em; }
    .botoes-acao { display: flex; gap: 10px; }
    
    .btn-zerar { background: #e53935; color: #fff; border: none; padding: 12px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.95em; }
    .btn-whatsapp { background: #25d366; color: #fff; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.95em; }
    .btn-whatsapp:hover { background: #1eb954; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cardápio Vida Mix</h1>
    
    <!-- Lista dos Produtos -->
    <div id="lista-produtos"></div>

    <!-- PAINEL VISÍVEL: Total, Pagamento e Botões -->
    <div class="painel-finalizacao">
      <div class="val-total">
        Total: R$ <span id="valor-total">0,00</span>
      </div>

      <div class="opcoes-pagamento">
        <label for="pagamento"><strong>Pagamento:</strong></label>
        <select id="pagamento">
          <option value="Pix - chave: belabelpeixoto@gmail.com">Pix - chave: belabelpeixoto@gmail.com</option>
        </select>
      </div>

      <div class="botoes-acao">
        <button class="btn-zerar" onclick="zerarPedido()">Zerar Quantidades</button>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar Pedido no WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    // Coloque seu número do WhatsApp com DDD aqui (Exemplo Maringá/PR: 5544999999999)
    var numeroWhatsApp = "5544998546285"; 

    var produtos = [
      { id: 1, nome: "Cesta: Amor que nutre. (Dia das Mães)", preco: 120.00, unidade: "unidade", ingredientes: "Bolo de chocolate; Pão recheado; Esfihas; Biscoito da vovó; Pão tipo bisnaguinha; suco." },
      { id: 2, nome: "Pão Australiano", preco: 80.00, unidade: "kg", ingredientes: "Cacau; mel; Farinha de arroz." },

      { id: 5, nome: "Pão Italiano", preco: 75.00, unidade: "kg", ingredientes: "Farinha de grão de bico; Farinha de arroz; Fécula de batata." },
      { id: 6, nome: "Bolinho frito da vovó", preco: 80.00, unidade: "kg", ingredientes: "Polvilho doce; farinha de arroz." },
      { id: 7, nome: "Pão de Hambúrguer", preco: 80.00, unidade: "kg", ingredientes: "Fécula de batata; farinha de grão de bico." },
      { id: 8, nome: "Pãozinho recheado", preco: 8.00, unidade: "un (mínimo 6)", ingredientes: "Recheado com: Frango, mussarela e presunto, carne." },
      { id: 9, nome: "Esfirra de carne ou frango", preco: 8.00, unidade: "un (mínimo 6)", ingredientes: "Mix de farinhas para pão; farinha de grão de bico; psyllium." },
      { id: 10, nome: "Bolo de Banana", preco: 75.00, unidade: "kg", ingredientes: "Bolo de banana caramelizada." },
      { id: 11, nome: "Bolo de Café", preco: 75.00, unidade: "kg", ingredientes: "Açúcar demerara; farinha de aveia; cacau em pó 100%; ovos; farinha de linhaça dourada." },
      { id: 12, nome: "Bolo mesclado simples", preco: 75.00, unidade: "kg", ingredientes: "Açúcar demerara; óleo de girassol; vinagre de maçã; ovos; leite de coco; mix de farinhas." },
      { id: 13, nome: "Pão de lanche", preco: 75.00, unidade: "kg", ingredientes: "Mix de farinhas; açúcar demerara; óleo de girassol; ovos." },
      { id: 14, nome: "Pão Multigrãos", preco: 75.00, unidade: "kg", ingredientes: "Farinha de arroz; Fécula de mandioca; amido de milho; psyllium; ovos; vinagre de maçã." },
      { id: 15, nome: "Pão tipo Bisnaguinha", preco: 75.00, unidade: "kg", ingredientes: "Farinha de arroz; óleo de girassol; Fécula de mandioca; farinha de grão de bico; farinha de feijão branco; ovos." },
      { id: 16, nome: "Pão de batata doce", preco: 75.00, unidade: "kg", ingredientes: "Farinha de arroz; farinha de grão de bico; batata doce; farinha de feijão branco; Fécula de batata; óleo de girassol; ovos." },
      { id: 17, nome: "Bolo de laranja", preco: 75.00, unidade: "kg", ingredientes: "Bolo de laranja com cobertura." },
      { id: 18, nome: "Pão de sementes", preco: 75.00, unidade: "kg", ingredientes: "Farinha de arroz; Fécula de mandioca; Fécula de batata; farinha de linhaça dourada; ovos; quinoa em flocos." },
      { id: 19, nome: "Pão de milho", preco: 75.00, unidade: "kg", ingredientes: "Farinha de arroz; amido de milho; fubá; açúcar demerara; vinagre de maçã; ovos; polvilho doce." },
      { id: 20, nome: "Pão de batata doce e pão de hambúrguer", preco: 75.00, unidade: "kg", ingredientes: "Farinha de arroz; polvilho azedo; Fécula de mandioca; amido de milho; vinagre de maçã; ovos; açúcar demerara." },
      { id: 21, nome: "Pão de Forma branco", preco: 75.00, unidade: "kg", ingredientes: "Farinha de arroz; Fécula de mandioca; Fécula de batata; amido de milho; fubá; açúcar demerara; ovos; óleo de girassol." },
      { id: 22, nome: "Pão Recheado", preco: 130.00, unidade: "kg", ingredientes: "Mix para pão; óleo de girassol; açúcar demerara." },
      { id: 23, nome: "Bolo de amendoim", preco: 130.00, unidade: "kg", ingredientes: "Açúcar demerara; farinha de arroz; óleo de girassol; amido de milho; cacau; ovos." },
      { id: 24, nome: "Bolo de chocolate", preco: 85.00, unidade: "kg", ingredientes: "Mix de bolo; açúcar demerara; cacau em pó 100%; óleo de girassol; sal do Himalaia." },
      { id: 25, nome: "Empadão de Frango", preco: 110.00, unidade: "kg", ingredientes: "Farinha de arroz; banha ou óleo de girassol." },
      { id: 26, nome: "Bolo Tipo Charge", preco: 80.00, unidade: "kg", ingredientes: "Bolo com cobertura de chocolate e amendoim." },
      { id: 27, nome: "Bolo de Cenoura", preco: 80.00, unidade: "kg", ingredientes: "Mix de farinhas; açúcar demerara; óleo de girassol." },
      { id: 28, nome: "Bolo de Limão", preco: 80.00, unidade: "kg", ingredientes: "Mix de farinhas; açúcar demerara; óleo de girassol." },
      { id: 29, nome: "Bolo mesclado com cobertura de brigadeiro", preco: 80.00, unidade: "kg", ingredientes: "Açúcar demerara; óleo de girassol; leite de inhame; mix de farinhas; cacau em pó 100%; manteiga ghee; ovos." }
    

    function montarTela() {
      var html = "";
      for (var i = 0; i < produtos.length; i++) {
        var p = produtos[i];
        html += '<div class="card-produto">';
        html += '  <div class="info">';
        html += '    <h3>' + p.nome + '</h3>';
        html += '    <div class="preco">R$ ' + p.preco.toFixed(2).replace('.', ',') + ' / ' + p.unidade + '</div>';
        html += '    <div class="ingredientes"><strong>Ingredientes:</strong> ' + p.ingredientes + '</div>';
        html += '  </div>';
        html += '  <div class="controles">';
        html += '    <label>' + (p.unidade === 'kg' ? 'Peso (kg):' : 'Qtd:') + '</label>';
        html += '    <input type="number" id="qtd-' + p.id + '" min="0" step="' + (p.unidade === 'kg' ? '0.1' : '1') + '" value="0" oninput="calcularTotal()">';
        html += '  </div>';
        html += '  <div class="subtotal">R$ <span id="subtotal-' + p.id + '">0,00</span></div>';
        html += '</div>';
      }
      document.getElementById('lista-produtos').innerHTML = html;
    }

    function calcularTotal() {
      var total = 0;
      for (var i = 0; i < produtos.length; i++) {
        var p = produtos[i];
        var input = document.getElementById('qtd-' + p.id);
        var subtotalSpan = document.getElementById('subtotal-' + p.id);
        if (input && subtotalSpan) {
          var qtd = parseFloat(input.value) || 0;
          var sub = qtd * p.preco;
          subtotalSpan.innerText = sub.toFixed(2).replace('.', ',');
          total += sub;
        }
      }
      document.getElementById('valor-total').innerText = total.toFixed(2).replace('.', ',');
    }

    function zerarPedido() {
      for (var i = 0; i < produtos.length; i++) {
        var input = document.getElementById('qtd-' + produtos[i].id);
        if (input) input.value = 0;
      }
      calcularTotal();
    }

    function enviarWhatsApp() {
      var texto = "Pedido Vida Mix\n\n";
      var temItens = false;
      var total = 0;

      for (var i = 0; i < produtos.length; i++) {
        var p = produtos[i];
        var input = document.getElementById('qtd-' + p.id);
        if (input) {
          var qtd = parseFloat(input.value) || 0;
          if (qtd > 0) {
            temItens = true;
            var sub = qtd * p.preco;
            total += sub;
            texto += "• " + p.nome + "\n  Qtd/Peso: " + qtd + " (" + p.unidade + ") - R$ " + sub.toFixed(2).replace('.', ',') + "\n";
          }
        }
      }

      if (!temItens) {
        alert("Selecione pelo menos um item para enviar o pedido.");
        return;
      }

      var formaPagamento = document.getElementById('pagamento').value;
      texto += "\n*Total do Pedido:* R$ " + total.toFixed(2).replace('.', ',');
      texto += "\n*Forma de Pagamento:* " + formaPagamento;

      var link = "https://api.whatsapp.com/send?phone=" + numeroWhatsApp + "&text=" + encodeURIComponent(texto);
      window.open(link, '_blank');
    }

    montarTela();
  </script>
</body>
</html>
