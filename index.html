<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidamix - Delícias Artesanais Sem Glúten e Sem Lactose</title>
    <style>
        :root {
            --primary-color: #2c5e3b;
            --primary-dark: #1e3f27;
            --secondary-color: #d35400;
            --bg-gradient: linear-gradient(135deg, #f4efe6 0%, #e8dfd1 100%);
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-muted: #666666;
            --accent-color: #27ae60;
            --accent-hover: #219653;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            padding-bottom: 80px;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-color));
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-bottom: 4px solid var(--secondary-color);
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            max-width: 1200px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }
        .category-title {
            font-size: 1.5rem;
            color: var(--primary-dark);
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 0.4rem;
            margin: 3rem 0 1.5rem 0;
            display: inline-block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }
        .card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background-color: #f0f0f0;
        }
        .card-content {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary-dark);
        }
        .card-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-grow: 1;
            line-height: 1.4;
        }
        .card-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f6f0;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #eadecd;
        }
        .quantity-control label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
        }
        .counter-btns {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .counter-btns button {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .counter-btns button:hover {
            background: var(--primary-dark);
        }
        .counter-value {
            font-weight: bold;
            font-size: 1rem;
            min-width: 22px;
            text-align: center;
            color: var(--primary-dark);
        }
        .btn-order {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none;
            text-align: center;
            display: block;
            width: 100%;
            box-shadow: 0 3px 8px rgba(39, 174, 96, 0.3);
        }
        .btn-order:hover {
            background-color: var(--accent-hover);
        }
        .btn-order:active {
            transform: scale(0.98);
        }
        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            background-color: #1a252f;
            color: white;
            margin-top: 4rem;
            font-size: 0.9rem;
            border-top: 4px solid var(--primary-color);
        }
        footer p {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vidamix - Delícias Artesanais</h1>
        <p>Cardápio Exclusivo Sem Glúten e Sem Lactose. Monte seu pedido com facilidade e encomende diretamente pelo WhatsApp!</p>
    </header>

    <div class="container" id="catalog-container">
        <!-- O catálogo será gerado automaticamente aqui -->
    </div>

    <footer>
        <p><strong>Vidamix Delícias Artesanais</strong> | WhatsApp: (44) 99854-6285<br>Todos os produtos são isentos de glúten e lactose, feitos com ingredientes selecionados.</p>
    </footer>

    <script>
        const products = [
            // Cestas Especiais
            { id: 1, category: "Cestas Especiais", name: "Cesta: Amor que nutre (Dia das Mães)", desc: "Seleção especial de produtos sem glúten e sem lactose, feita com muito carinho.", price: 129.90, unit: "unidade" },
            
            // Pães e Baguetes
            { id: 2, category: "Pães e Baguetes", name: "Pão Integral com Sementes", desc: "Massa macia e nutritiva, rica em fibras, com mix de farinhas.", price: 24.90, unit: "unidade" },
            { id: 3, category: "Pães e Baguetes", name: "Pão Multigrãos", desc: "Saboroso e crocante, perfeito para acompanhar o seu café.", price: 26.90, unit: "unidade" },
            { id: 4, category: "Pães e Baguetes", name: "Pão de Forma Tradicional", desc: "Leve e versátil, ideal para todas as horas do dia.", price: 22.90, unit: "unidade" },
            { id: 13, category: "Pães e Baguetes", name: "Pão Rústico Artesanal", desc: "Pão artesanal rústico com miolo macio e crosta marcante.", price: 25.90, unit: "unidade" },
            { id: 14, category: "Pães e Baguetes", name: "Pão de Abóbora com Sementes", desc: "Massa fofinha e nutritiva com toque de abóbora, coberta com mix de sementes.", price: 27.90, unit: "unidade" },
            { id: 16, category: "Pães e Baguetes", name: "Pão de Forma Embalado", desc: "Produto fresco embalado com carinho e identificação artesanal.", price: 24.90, unit: "unidade" },
            { id: 17, category: "Pães e Baguetes", name: "Kit Dupla de Pães Artesanais", desc: "Seleção com dois tipos de pães especiais da casa.", price: 48.00, unit: "kit" },
            { id: 18, category: "Pães e Baguetes", name: "Pão Rústico Enfarinhado", desc: "Pão com casca levemente enfarinhada e sabor tradicional artesanal.", price: 25.90, unit: "unidade" },
            { id: 20, category: "Pães e Baguetes", name: "Pão Branco de Forma Embalado", desc: "Composição detalhada: fécula de mandioca, farinha de arroz e fécula de batata.", price: 23.90, unit: "unidade" },
            { id: 21, category: "Pães e Baguetes", name: "Baguetes Rústicas", desc: "Baguetes sem glúten e sem lactose com gergelim, excelente textura.", price: 12.90, unit: "unidade" },

            // Pãezinhos e Quitutes
            { id: 5, category: "Pãezinhos e Quitutes", name: "Pãozinho Rústico", desc: "Casquinha crocante e miolo macio.", price: 3.50, unit: "unidade" },
            { id: 6, category: "Pãezinhos e Quitutes", name: "Mini Pão Redondo", desc: "Ideais para sanduíches e lanches rápidos.", price: 15.00, unit: "pct" },
            { id: 7, category: "Pãezinhos e Quitutes", name: "Palitos de Queijo", desc: "Crocantes e irresistíveis, perfeitos para o petisco.", price: 18.90, unit: "pacote" },
            { id: 8, category: "Pãezinhos e Quitutes", name: "Pãozinho Recheado", desc: "Saboroso recheio de frango cremoso.", price: 8.90, unit: "unidade" },
            { id: 15, category: "Pãezinhos e Quitutes", name: "Kit Pãezinhos com Gergelim", desc: "Massa macia e levemente salpicada com gergelim.", price: 28.00, unit: "kit" },
            { id: 19, category: "Pãezinhos e Quitutes", name: "Cesta de Pãezinhos e Pão Central", desc: "Mix de pãezinhos redondos e pão maior com gergelim em cesta rústica.", price: 45.00, unit: "cesta" },

            // Bolos e Tortas
            { id: 9, category: "Bolos e Tortas", name: "Esfihas ou Salgados", desc: "Opções deliciosas de carne ou frango artesanais.", price: 32.00, unit: "kit" },
            { id: 10, category: "Bolos e Tortas", name: "Torta de Banana Caramelizada", desc: "Doce na medida certa, com cobertura brilhante e massa especial.", price: 55.00, unit: "unidade" },
            { id: 11, category: "Bolos e Tortas", name: "Bolo de Café", desc: "Sabor intenso e textura fofinha, perfeito para o lanche.", price: 45.00, unit: "unidade" },
            { id: 12, category: "Bolos e Tortas", name: "Bolo Mesclado", desc: "Uma combinação deliciosa de massa branca e chocolate, super fofinha.", price: 48.00, unit: "unidade" },
            { id: 22, category: "Bolos e Tortas", name: "Bolo de Chocolate com Amendoim", desc: "Massa fofinha com cobertura cremosa de chocolate e amendoim crocante.", price: 52.00, unit: "unidade" },
            { id: 23, category: "Bolos e Tortas", name: "Bolo Vulcão de Chocolate", desc: "Bolo com furo central transbordando calda cremosa e lascas de chocolate.", price: 49.90, unit: "unidade" },
            { id: 24, category: "Bolos e Tortas", name: "Tortas Salgadas Artesanais", desc: "Tortas recheadas em tamanho família/marmita com linda decoração artesanal.", price: 58.00, unit: "unidade" },
            { id: 25, category: "Bolos e Tortas", name: "Bolo Festivo de Chocolate e Amendoim", desc: "Cobertura e recheio generosos com amendoim picado selecionado.", price: 65.00, unit: "unidade" },
            { id: 26, category: "Bolos e Tortas", name: "Bolo Vulcão Clássico", desc: "Massa leve e fofinha com cavidade recheada de calda de chocolate.", price: 46.00, unit: "unidade" },
            { id: 27, category: "Bolos e Tortas", name: "Bolo Especial de Limão", desc: "Massa leve com toque cítrico, cobertura cremosa branca e raspas de limão.", price: 46.00, unit: "unidade" },
            { id: 28, category: "Bolos e Tortas", name: "Kit Degustação / Bastidores", desc: "Variedade de pães e bolos recém-saídos do forno artesanal.", price: 50.00, unit: "kit" },
            { id: 29, category: "Bolos e Tortas", name: "Bolo Mesclado com Brigadeiro", desc: "Feito com mix de farinhas, cacau em pó 100%, manteiga GHE e ovos. Cobertura especial.", price: 54.00, unit: "unidade" }
        ];

        const categories = [...new Set(products.map(p => p.category))];
        const container = document.getElementById('catalog-container');

        categories.forEach(cat => {
            const catTitle = document.createElement('h2');
            catTitle.className = 'category-title';
            catTitle.textContent = cat;
            container.appendChild(catTitle);

            const grid = document.createElement('div');
            grid.className = 'grid';

            products.filter(p => p.category === cat).forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${product.id}.jpeg" alt="${product.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Vidamix+Foto+${product.id}'">
                    <div class="card-content">
                        <div class="card-title">${product.name}</div>
                        <div class="card-desc">${product.desc}</div>
                        <div class="card-price">R$ ${product.price.toFixed(2).replace('.', ',')}</div>
                        <div class="quantity-control">
                            <label>Qtd (${product.unit}):</label>
                            <div class="counter-btns">
                                <button onclick="changeQty(${product.id}, -1)">-</button>
                                <span class="counter-value" id="qty-${product.id}">1</span>
                                <button onclick="changeQty(${product.id}, 1)">+</button>
                            </div>
                        </div>
                        <a href="#" class="btn-order" onclick="sendOrder(event, '${product.name}', ${product.id}, ${product.price})">Pedir no WhatsApp</a>
                    </div>
                `;
                grid.appendChild(card);
            });

            container.appendChild(grid);
        });

        function changeQty(id, delta) {
            const qtySpan = document.getElementById(qty-${id});
            let current = parseInt(qtySpan.textContent) + delta;
            if (current < 1) current = 1;
            qtySpan.textContent = current;
        }

        function sendOrder(event, productName, id, unitPrice) {
            event.preventDefault();
            const qty = parseInt(document.getElementById(qty-${id}).textContent);
            const total = (qty * unitPrice).toFixed(2).replace('.', ',');
            const message = Olá! Gostaria de encomendar:\n*${qty}x ${productName}*\nTotal estimado: R$ ${total}\n(Vidamix Artesanais);
            const encoded = encodeURIComponent(message);
            window.open(https://wa.me/5544998546285?text=${encoded}, '_blank');
        }
    </script>
</body>
</html>
